openapi: 3.0.3
info:
  title: AccountBook API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
components:
  schemas:
    Transaction:
      type: object
      required: [id, type, amount, occurredOn, categoryId]
      properties:
        id: { type: string, minLength: 1 }
        type: { type: string, enum: [INCOME, EXPENSE] }
        amount: { type: integer, minimum: 1 }
        occurredOn: { type: string, format: date }
        categoryId: { type: string, minLength: 1 }
        memo: { type: string, maxLength: 500 }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }

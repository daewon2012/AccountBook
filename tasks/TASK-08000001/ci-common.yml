name: CI Common

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      package-manager:
        required: false
        type: string
        default: "pnpm"
      run-build:
        required: false
        type: boolean
        default: true
      test-command:
        required: false
        type: string
        default: "pnpm test"
  workflow_dispatch:

concurrency:
  group: ci-common-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Build
        if: ${{ inputs.run-build }}
        run: pnpm build

      - name: Upload coverage (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage
          if-no-files-found: ignore
